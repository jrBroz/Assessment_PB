spring:
  application:
    name: order-service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        # Não devolve a mensagem para a fila original em loop infinito:
        # após esgotar as tentativas, ela é encaminhada para a Dead Letter Queue.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0
          max-interval: 10000ms
  datasource:
    url: jdbc:h2:mem:commondatadb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
server:
  port: 0
eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
integration:
  product:
    base-url: http://localhost:8082
  payment:
    base-url: http://localhost:8083

# ==========================================
# CONFIGURAÇÃO DE OBSERVABILIDADE (ACTUATOR + PROMETHEUS)
# ==========================================
management:
  endpoints:
    web:
      exposure:
        # Por padrão, apenas 'health' fica exposto.
        include: "health,prometheus"
  endpoint:
    health:
      # Opcional: Mostra detalhes do banco, disco, etc.
      show-details: always
  metrics:
    tags:
      # Cria uma tag global com o nome do serviço. 
      application: ${spring.application.name} 