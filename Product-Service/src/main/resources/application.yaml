spring:
  application:
    name: product-service
  datasource:
    url: jdbc:h2:mem:productdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
server:
  port: 8082
logging:
  level:
    org.hibernate: OFF
    org.springframework.orm.jpa: OFF
    com.zaxxer.hikari: OFF
    org.springframework.jdbc: OFF