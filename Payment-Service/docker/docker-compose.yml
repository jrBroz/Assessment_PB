version: '3.8'

services:
  postgres-payment:
    image: postgres:16
    container_name: paymentdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paymentdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data

volumes:
  postgres-payment-data: